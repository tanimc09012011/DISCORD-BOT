<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bot Web Control Panel</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1f22; color: #dbdee1; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #5865f2; margin-bottom: 20px; }
        .card { background: #2b2d31; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #35363c; }
        h2 { color: #f2f3f5; font-size: 1.2rem; margin-bottom: 15px; border-bottom: 1px solid #3f4147; padding-bottom: 8px; }
        input[type="text"], input[type="time"], textarea, input[type="file"] { width: 100%; padding: 10px; background: #1e1f22; border: 1px solid #3f4147; border-radius: 4px; color: #fff; margin-bottom: 12px; font-size: 14px; }
        textarea { height: 120px; resize: vertical; }
        button { background-color: #5865f2; color: white; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; width: 100%; transition: 0.2s; }
        button:hover { background-color: #4752c4; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #3f4147; padding: 8px; text-align: left; font-size: 13px; }
        th { background: #1e1f22; color: #5865f2; }
        .alert { margin-top: 10px; padding: 10px; border-radius: 4px; display: none; font-size: 14px; }
        .success { background: #23a55a; color: white; }
        .error { background: #f23f43; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎮 Discord Bot Dashboard</h1>

        <!-- ১. টিম লিস্ট সেটআপ -->
        <div class="card">
            <h2>১. টিম লিস্ট ইনপুট ও আপডেট</h2>
            <textarea id="rawTeamList" placeholder="GROUP - A&#10;1.NO MERCY&#10;2.VIKINGS&#10;3.TEAM ZYRO&#10;&#10;GROUP - B&#10;1.TTR"></textarea>
            <button onclick="saveTeams()">টিম লিস্ট সেভ করুন</button>
        </div>

        <!-- ২. সরাসরি মেসেজ ও ফাইল পাঠানো -->
        <div class="card">
            <h2>২. মেসেজ ও ফাইল পাঠান (Bot ID দিয়ে যাবে)</h2>
            <input type="text" id="sendChannelId" placeholder="Channel ID দিন">
            <textarea id="sendMessageText" placeholder="আপনার মেসেজটি লিখুন..."></textarea>
            <input type="file" id="sendFile">
            <button onclick="sendMessage()">মেসেজ পাঠান</button>
        </div>

        <!-- ৩. শিডিউল মেসেজ -->
        <div class="card">
            <h2>৩. শিডিউল মেসেজ (Time Schedule)</h2>
            <input type="text" id="schedChannelId" placeholder="Channel ID দিন">
            <textarea id="schedMessageText" placeholder="শিডিউল মেসেজের বিষয়বস্তু..."></textarea>
            <label style="font-size:12px; margin-bottom: 4px; display:block;">সময় নির্বাচন করুন (বাংলাদেশ সময় অনুযায়ী):</label>
            <input type="time" id="schedTime">
            <button onclick="scheduleMessage()">মেসেজ শিডিউল করুন</button>
        </div>

        <!-- ৪. অটো-রোল সামারি রিাপোর্ট -->
        <div class="card">
            <h2>৪. রোল দেওয়া টিমের সামারি লিস্ট</h2>
            <button onclick="loadSummary()" style="background-color:#4e5058; margin-bottom:10px;">লিস্ট রিফ্রেশ করুন</button>
            <table>
                <thead>
                    <tr>
                        <th>ইউজার</th>
                        <th>টিম</th>
                        <th>গ্রুপ</th>
                        <th>কোড</th>
                        <th>সময়</th>
                    </tr>
                </thead>
                <tbody id="summaryTable">
                    <tr><td colspan="5" style="text-align:center;">কোনো ডেটা পাওয়া যায়নি</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function saveTeams() {
            const rawList = document.getElementById('rawTeamList').value;
            const res = await fetch('/api/save-teams', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ rawList })
            });
            const data = await res.json();
            alert(data.message || data.error);
        }

        async function sendMessage() {
            const channelId = document.getElementById('sendChannelId').value;
            const messageText = document.getElementById('sendMessageText').value;
            const fileInput = document.getElementById('sendFile');

            const formData = new FormData();
            formData.append('channelId', channelId);
            formData.append('messageText', messageText);
            if (fileInput.files[0]) {
                formData.append('file', fileInput.files[0]);
            }

            const res = await fetch('/api/send-message', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            alert(data.message || data.error);
        }

        async function scheduleMessage() {
            const channelId = document.getElementById('schedChannelId').value;
            const messageText = document.getElementById('schedMessageText').value;
            const time = document.getElementById('schedTime').value;

            const res = await fetch('/api/schedule-message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ channelId, messageText, time })
            });
            const data = await res.json();
            alert(data.message || data.error);
        }

        async function loadSummary() {
            const res = await fetch('/api/summary');
            const data = await res.json();
            const table = document.getElementById('summaryTable');
            table.innerHTML = '';

            if (data.logs.length === 0) {
                table.innerHTML = '<tr><td colspan="5" style="text-align:center;">কোনো তথ্য নেই</td></tr>';
                return;
            }

            data.logs.forEach(log => {
                table.innerHTML += `
                    <tr>
                        <td>${log.user}</td>
                        <td>${log.team}</td>
                        <td>${log.group}</td>
                        <td>${log.code}</td>
                        <td>${log.time}</td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
