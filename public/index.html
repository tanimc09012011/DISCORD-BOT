<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TANIM ER WIFE - TYRONEX PRODUCTION</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #07090e;
      --card-bg: #0f141d;
      --accent-color: #00e5ff;
      --accent-hover: #00b3cc;
      --text-main: #ffffff;
      --text-muted: #8393a7;
      --border-color: #1a2332;
      --danger-color: #ff3366;
      --success-color: #00e676;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding-bottom: 3rem; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 3rem; background: rgba(7, 9, 14, 0.95);
      backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color);
      position: sticky; top: 0; z-index: 100;
    }
    .brand-section { display: flex; align-items: center; gap: 0.8rem; font-weight: 800; font-size: 1.1rem; }
    .brand-logo { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--accent-color); object-fit: cover; }
    
    nav { display: flex; gap: 1.5rem; }
    nav a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    nav a.active, nav a:hover { color: var(--accent-color); }

    .user-profile { display: flex; align-items: center; gap: 0.8rem; background: var(--card-bg); padding: 0.4rem 0.8rem; border-radius: 20px; border: 1px solid var(--border-color); }
    .avatar-upload { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; object-fit: cover; }

    main { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }
    .title { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.4rem; }
    .subtitle { color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.85rem; }

    .server-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .server-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s; }
    .server-card:hover { border-color: var(--accent-color); }
    
    .btn { background: var(--accent-color); color: #000; font-weight: 700; font-size: 0.85rem; padding: 0.6rem 1.2rem; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: var(--accent-hover); }
    .btn-danger { background: var(--danger-color); color: #fff; }

    .panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 1.8rem; margin-top: 1.5rem; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.4rem; font-weight: 600; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; background: #07090e; border: 1px solid var(--border-color); padding: 0.8rem; border-radius: 8px; color: #fff; outline: none; }

    .chat-box { background: #07090e; border: 1px solid var(--border-color); border-radius: 12px; padding: 1rem; max-height: 350px; overflow-y: auto; margin-bottom: 1rem; }
    .chat-msg { background: var(--card-bg); border: 1px solid var(--border-color); padding: 0.8rem; border-radius: 10px; margin-bottom: 0.8rem; display: flex; gap: 0.8rem; }
    .user-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
    .msg-content { flex: 1; }
    .msg-header { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.3rem; }

    #notificationToast {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--card-bg); border: 1px solid var(--accent-color);
      color: var(--text-main); padding: 0.8rem 1.8rem; border-radius: 30px;
      box-shadow: 0 10px 25px rgba(0, 229, 255, 0.2); z-index: 9999;
      font-weight: 600; font-size: 0.9rem; transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0; display: flex; align-items: center; gap: 0.5rem;
    }
    #notificationToast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    .login-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(7, 9, 14, 0.96); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .login-modal { background: var(--card-bg); border: 1px solid var(--border-color); padding: 2.5rem; border-radius: 16px; width: 100%; max-width: 380px; text-align: center; }
  </style>
</head>
<body>

  <div id="notificationToast"><span>ℹ️</span><span id="toastMessage">Notification</span></div>

  <div class="login-overlay" id="loginModal">
    <div class="login-modal">
      <img src="https://i.postimg.cc/vBhXVpGJ/Gemini-Generated-Image-ujmtu4ujmtu4ujmt-(1).jpg" class="brand-logo" style="width: 60px; height: 60px; margin-bottom: 1rem;">
      <h2>TANIM ER WIFE</h2>
      <p style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 1.5rem;">TYRONEX PRODUCTION</p>
      <div class="form-group"><input type="text" id="adminEmail" placeholder="Email Address"></div>
      <div class="form-group"><input type="password" id="adminPass" placeholder="Password"></div>
      <button class="btn" style="width: 100%;" onclick="loginAdmin()">Login</button>
    </div>
  </div>

  <header>
    <div class="brand-section">
      <img src="https://i.postimg.cc/vBhXVpGJ/Gemini-Generated-Image-ujmtu4ujmtu4ujmt-(1).jpg" class="brand-logo" alt="Logo">
      <span>TANIM ER WIFE <small style="color:var(--text-muted); font-weight:400;">| TYRONEX</small></span>
    </div>
    <nav>
      <a id="navHome" class="active" onclick="switchTab('home')">Live chat</a>
      <a id="navRoles" onclick="switchTab('roles')">Roles</a>
      <a id="navSchedule" onclick="switchTab('schedule')">Schedule</a>
      <a id="navVoice" onclick="switchTab('voice')">Voice</a>
      <a id="navAdmins" onclick="switchTab('admins')">Admins</a>
    </nav>
    <div class="user-profile">
      <img src="https://i.postimg.cc/vBhXVpGJ/Gemini-Generated-Image-ujmtu4ujmtu4ujmt-(1).jpg" id="profilePic" class="avatar-upload">
      <span id="profileName" style="font-size: 0.85rem; font-weight: 600;">Head Admin</span>
      <button onclick="logoutAdmin()" style="background:none; border:none; color:var(--danger-color); cursor:pointer; font-size:0.8rem; margin-left:0.5rem; font-weight:600;">Sign out</button>
    </div>
  </header>

  <main>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <div>
        <h1 class="title">Pick a server</h1>
        <p class="subtitle" id="selectedServerIndicator">কোনো সার্ভার সিলেক্ট করা হয়নি</p>
      </div>
      <button class="btn" style="background:var(--card-bg); border:1px solid var(--border-color); color:#fff;" onclick="loadServers()">Refresh servers</button>
    </div>

    <div class="server-grid" id="serverContainer"></div>

    <div id="workspaceSection" style="display:none;">
      <div class="panel">
        <div class="form-group" style="display: flex; gap: 0.8rem; align-items: flex-end;">
          <div style="flex: 1;">
            <label>Select Channel:</label>
            <select id="channelSelect" onchange="loadChannelMessages()"></select>
          </div>
          <button class="btn" style="background: var(--border-color); color: #fff; height: 42px;" onclick="loadChannelMessages()">Reload</button>
        </div>

        <div class="chat-box" id="chatBox">
          <p style="color: var(--text-muted); text-align: center; padding: 2rem;">চ্যানেল সিলেক্ট করলে মেসেজগুলো এখানে দেখা যাবে।</p>
        </div>

        <div class="form-group">
          <input type="hidden" id="replyToId">
          <textarea id="messageText" rows="3" placeholder="Write a message"></textarea>
        </div>
        
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <input type="file" id="fileInput" style="color:var(--text-muted); font-size:0.8rem;">
          <button class="btn" onclick="sendMessage()">Send message</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    let activeAuth = '';
    let selectedGuildId = null;

    function showToast(message) {
      const toast = document.getElementById('notificationToast');
      document.getElementById('toastMessage').innerText = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedAuth = localStorage.getItem('adminAuth');
      if (savedAuth) {
        activeAuth = savedAuth;
        document.getElementById('loginModal').style.display = 'none';
        loadServers();
      }
    });

    async function loginAdmin() {
      const email = document.getElementById('adminEmail').value;
      const password = document.getElementById('adminPass').value;
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if(res.ok) {
          activeAuth = 'Basic ' + btoa(email + ':' + password);
          localStorage.setItem('adminAuth', activeAuth);
          document.getElementById('loginModal').style.display = 'none';
          document.getElementById('profileName').innerText = data.admin.name;
          loadServers();
          showToast('সফলভাবে লগইন করা হয়েছে!');
        } else {
          showToast(data.error || 'লগইন ব্যর্থ হয়েছে।');
        }
      } catch (err) {
        showToast('সার্ভারের সাথে যোগাযোগ করতে সমস্যা হচ্ছে!');
      }
    }

    function logoutAdmin() {
      localStorage.removeItem('adminAuth');
      activeAuth = '';
      document.getElementById('loginModal').style.display = 'flex';
      document.getElementById('serverContainer').innerHTML = '';
      showToast('লগআউট করা হয়েছে।');
    }

    function switchTab(tab) {
      showToast('এই ফিচারটি সিলেক্টেড সার্ভারের জন্য প্রযোজ্য।');
    }

    async function loadServers() {
      if (!activeAuth) return;
      try {
        const res = await fetch('/api/guilds', { headers: { 'Authorization': activeAuth } });
        if (!res.ok) {
          if (res.status === 401 || res.status === 403) logoutAdmin();
          return;
        }

        const guilds = await res.json();
        const container = document.getElementById('serverContainer');
        container.innerHTML = '';

        if (Array.isArray(guilds) && guilds.length > 0) {
          guilds.forEach(g => {
            const icon = g.icon ? `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png` : 'https://cdn.discordapp.com/embed/avatars/0.png';
            container.innerHTML += `
              <div class="server-card" onclick="openServer('${g.id}', '${g.name}')">
                <div style="display:flex; align-items:center; gap:0.8rem;">
                  <img src="${icon}" style="width:40px; height:40px; border-radius:8px;">
                  <div><h4 style="font-size:0.9rem;">${g.name}</h4></div>
                </div>
                <span style="color:var(--accent-color); font-size:0.8rem; font-weight:600;">Select &rarr;</span>
              </div>
            `;
          });
          showToast('সার্ভারগুলো লোড হয়েছে!');
        } else {
          container.innerHTML = '<p style="color:var(--text-muted);">কোনো অ্যাক্টিভ ডিসকর্ড সার্ভার পাওয়া যায়নি। বট কি সার্ভারে অ্যাড করা আছে?</p>';
        }
      } catch (err) {
        console.error('Error loading servers:', err);
      }
    }

    async function openServer(guildId, guildName) {
      selectedGuildId = guildId;
      document.getElementById('selectedServerIndicator').innerText = "Active Server: " + guildName;
      document.getElementById('workspaceSection').style.display = 'block';

      const resCat = await fetch(`/api/guild/${guildId}/categories-channels`);
      const categories = await resCat.json();
      const chSelect = document.getElementById('channelSelect');
      chSelect.innerHTML = '<option value="">-- Text Channel select করুন --</option>';

      for (const [catName, channels] of Object.entries(categories)) {
        let optGroup = `<optgroup label="📂 ${catName}">`;
        channels.forEach(ch => { optGroup += `<option value="${ch.id}">💬 ${ch.name}</option>`; });
        optGroup += `</optgroup>`;
        chSelect.innerHTML += optGroup;
      }
      showToast(guildName + ' সার্ভার সিলেক্ট করা হয়েছে!');
    }

    async function loadChannelMessages() {
      const channelId = document.getElementById('channelSelect').value;
      if(!channelId) return;
      try {
        const res = await fetch(`/api/channel/${channelId}/messages`);
        const msgs = await res.json();
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '';

        if(msgs.length === 0) {
          chatBox.innerHTML = '<p style="color:var(--text-muted); text-align:center;">এই চ্যানেলে কোনো মেসেজ নেই।</p>';
          return;
        }

        msgs.forEach(m => {
          chatBox.innerHTML += `
            <div class="chat-msg">
              <img src="${m.authorAvatar}" class="user-avatar">
              <div class="msg-content">
                <div class="msg-header"><span style="color:${m.authorColor || '#fff'};">${m.author}</span> <small style="color:var(--text-muted);">${m.timestamp}</small></div>
                <p style="font-size:0.85rem;">${m.content}</p>
              </div>
            </div>
          `;
        });
      } catch (err) {
        showToast('মেসেজ লোড করতে সমস্যা হয়েছে!');
      }
    }

    async function sendMessage() {
      const channelId = document.getElementById('channelSelect').value;
      const messageText = document.getElementById('messageText').value;
      const fileInput = document.getElementById('fileInput');

      if(!channelId || (!messageText && !fileInput.files[0])) return showToast('চ্যানেল এবং মেসেজ বা ফাইল দিন!');

      const formData = new FormData();
      formData.append('channelId', channelId);
      formData.append('messageText', messageText);
      if(fileInput.files[0]) formData.append('file', fileInput.files[0]);

      const res = await fetch('/api/send-message', { method: 'POST', body: formData });
      const data = await res.json();
      showToast(data.message || data.error);
      document.getElementById('messageText').value = '';
      fileInput.value = '';
      loadChannelMessages();
    }
  </script>
</body>
</html>
