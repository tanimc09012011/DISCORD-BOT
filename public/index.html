<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TANIM ER WIFE · TYRONEX PRODUCTION</title>
<link rel="icon" href="https://i.postimg.cc/vBhXVpGJ/Gemini-Generated-Image-ujmtu4ujmtu4ujmt-(1).jpg">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<style>
:root{--bg:#07060f;--panel:#0f0d1c;--panel2:#161329;--line:#2a2548;--text:#e8e6ff;--mute:#8d88b8;--cyan:#19e6ff;--purple:#a64dff;--red:#ff4d7a;--green:#2dffa0}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(900px 500px at 85% -10%,rgba(166,77,255,.18),transparent),radial-gradient(800px 500px at -10% 110%,rgba(25,230,255,.13),transparent),var(--bg);color:var(--text);font-family:'Rajdhani',system-ui,sans-serif;font-size:16px;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.hidden{display:none!important}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(15,13,28,.85);backdrop-filter:blur(8px)}
header img{width:44px;height:44px;border-radius:12px;border:2px solid var(--cyan);box-shadow:0 0 16px rgba(25,230,255,.55);object-fit:cover}
.brand{font-family:Orbitron,sans-serif;font-weight:800;font-size:18px;letter-spacing:.04em;background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.sub{font-size:13px;color:var(--mute);letter-spacing:.08em}
.spacer{flex:1}
.who{font-size:14px;color:var(--mute);text-align:right}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-weight:600;transition:border-color .15s,box-shadow .15s}
.btn:hover{border-color:var(--cyan);box-shadow:0 0 10px rgba(25,230,255,.3)}
.btn.primary{background:linear-gradient(90deg,var(--cyan),var(--purple));border:0;color:#07060f;font-weight:700}
.btn.danger:hover{border-color:var(--red);box-shadow:0 0 10px rgba(255,77,122,.3)}
.btn.on{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.layout{flex:1;display:flex;min-height:0}
#servers{width:78px;padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:10px;overflow-y:auto;border-right:1px solid var(--line);background:var(--panel)}
.srv{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--panel2) center/cover;display:grid;place-items:center;font-weight:700;transition:all .15s;flex:none}
.srv:hover{border-radius:16px;border-color:var(--purple)}
.srv.active{border-radius:16px;border-color:var(--cyan);box-shadow:0 0 14px rgba(25,230,255,.6)}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.sbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.sbar h2{margin:0;font-size:20px}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 10px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 14px;color:var(--mute);font-weight:600;white-space:nowrap}
nav button.active{color:var(--cyan);border-color:var(--cyan);text-shadow:0 0 10px rgba(25,230,255,.6)}
.tab{flex:1;min-height:0;display:none;padding:14px 16px;overflow:auto}
.tab.active{display:flex;flex-direction:column}
select,input[type=text],input[type=email],input[type=password],input[type=datetime-local],textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 8px rgba(25,230,255,.3)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:160px}
.empty{margin:auto;color:var(--mute);text-align:center;max-width:320px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
/* chat */
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:6px 2px;min-height:200px}
.msg{display:flex;gap:10px;padding:8px 10px;border-radius:10px}
.msg:hover{background:var(--panel)}
.msg img.av{width:38px;height:38px;border-radius:50%;flex:none}
.msg .head{font-weight:700}.msg .head small{color:var(--mute);font-weight:400;margin-left:6px}
.msg .body{white-space:pre-wrap;word-break:break-word}
.msg .refl{font-size:13px;color:var(--purple);margin-bottom:2px}
.msg .atts img{max-width:260px;max-height:200px;border-radius:8px;margin-top:6px;display:block}
.msg .atts a{color:var(--cyan)}
.react{display:inline-block;margin:4px 4px 0 0;padding:1px 8px;border:1px solid var(--line);border-radius:12px;font-size:14px;background:var(--panel2)}
.mact{margin-left:auto;display:flex;gap:2px;opacity:0;flex:none;align-self:flex-start}
.msg:hover .mact,.msg:focus-within .mact{opacity:1}
@media (hover:none){.mact{opacity:1}}
.mact button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
#composer{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
#replybar{font-size:14px;color:var(--purple);display:flex;gap:8px;align-items:center}
/* roles */
.split{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:14px;min-height:0;flex:1}
.list{display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0}
.item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);text-align:left;width:100%}
.item.sel{border-color:var(--cyan)}
.item img{width:30px;height:30px;border-radius:50%}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:5px 12px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);font-weight:600}
.chip.has{border-color:var(--cyan);box-shadow:0 0 8px rgba(25,230,255,.35)}
.chip:disabled{opacity:.4}
.pin{background:none;border:0;font-size:18px;color:var(--mute)}
.pin.on{color:var(--purple);text-shadow:0 0 8px var(--purple)}
/* voice */
.vm{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.vm img{width:36px;height:36px;border-radius:50%;border:2px solid transparent}
.vm.speak img{border-color:var(--green);box-shadow:0 0 12px var(--green)}
.tag{font-size:13px;color:var(--mute)}
.meter{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;width:140px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--purple))}
/* modal */
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(7,6,15,.92);z-index:50;padding:16px}
.modal{width:min(400px,100%);text-align:center;border:1px solid var(--purple);box-shadow:0 0 40px rgba(166,77,255,.35)}
.modal img{width:96px;height:96px;border-radius:20px;border:2px solid var(--cyan);box-shadow:0 0 24px rgba(25,230,255,.6);object-fit:cover}
.modal form{display:flex;flex-direction:column;gap:10px;margin-top:14px;text-align:left}
.modal h1{font-family:Orbitron,sans-serif;font-size:20px;margin:12px 0 2px}
.err{color:var(--red);font-size:14px;min-height:18px}
#toast{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:99}
.t{background:var(--panel2);border:1px solid var(--cyan);padding:10px 14px;border-radius:10px;box-shadow:0 0 14px rgba(25,230,255,.3)}
.t.bad{border-color:var(--red)}
@media (max-width:720px){
  #servers{width:62px}.srv{width:44px;height:44px}
  .split{grid-template-columns:1fr;overflow:auto}
  .who{display:none}.brand{font-size:15px}
  .msg .atts img{max-width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="login" class="overlay">
  <div class="card modal">
    <img src="https://i.postimg.cc/vBhXVpGJ/Gemini-Generated-Image-ujmtu4ujmtu4ujmt-(1).jpg" alt="TANIM ER WIFE logo">
    <h1 class="brand">TANIM ER WIFE</h1>
    <div class="sub">TYRONEX PRODUCTION · Admin sign in</div>
    <form id="loginForm">
      <input type="email" id="lEmail" placeholder="Admin email" autocomplete="username" required>
      <input type="password" id="lPass" placeholder="Password" autocomplete="current-password" required>
      <div class="err" id="lErr" role="alert"></div>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </div>
</div>

<header>
  <img src="https://i.postimg.cc/vBhXVpGJ/Gemini-Generated-Image-ujmtu4ujmtu4ujmt-(1).jpg" alt="TANIM ER WIFE logo">
  <div><div class="brand">TANIM ER WIFE</div><div class="sub">TYRONEX PRODUCTION</div></div>
  <div class="spacer"></div>
  <div class="who" id="who"></div>
  <button class="btn" id="logout">Sign out</button>
</header>

<div class="layout">
  <aside id="servers" aria-label="Servers"></aside>
  <main>
    <div class="sbar"><h2 id="sname">Pick a server</h2><div class="spacer"></div><button class="btn" id="refreshGuilds">Refresh servers</button></div>
    <nav id="tabs">
      <button data-t="chat" class="active">Live chat</button>
      <button data-t="roles">Roles</button>
      <button data-t="sched">Schedule</button>
      <button data-t="voice">Voice</button>
      <button data-t="admins" id="adminTabBtn" class="hidden">Admins</button>
    </nav>

    <section class="tab active" id="tab-chat">
      <div class="row" style="margin-bottom:8px"><select id="chanSel" class="grow" aria-label="Text channel"></select><button class="btn" id="reloadMsgs">Reload</button></div>
      <div id="msgs"><div class="empty">Select a server and a channel to see recent messages.</div></div>
      <form id="composer">
        <div id="replybar" class="hidden"><span id="replyTxt"></span><button type="button" class="btn" id="cancelReply">Cancel reply</button></div>
        <textarea id="msgText" rows="2" maxlength="2000" placeholder="Write a message"></textarea>
        <div class="row"><input type="file" id="files" multiple class="grow"><button class="btn primary" type="submit" id="sendBtn">Send message</button></div>
      </form>
    </section>

    <section class="tab" id="tab-roles">
      <div class="split">
        <div class="list" id="roleList"></div>
        <div class="card" style="overflow:auto">
          <div class="row" style="margin-bottom:10px"><input type="text" id="memberQ" class="grow" placeholder="Search members by name"><button class="btn" id="memberGo">Search</button></div>
          <div class="list" id="memberList" style="max-height:200px;margin-bottom:12px"></div>
          <div id="memberRoles"><div class="tag">Select a member to manage their roles. Pinned roles appear first.</div></div>
        </div>
      </div>
    </section>

    <section class="tab" id="tab-sched">
      <form id="schedForm" class="card" style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px">
        <div class="row"><select id="schedChan" class="grow" aria-label="Channel"></select><input type="datetime-local" id="schedAt" class="grow" required></div>
        <textarea id="schedText" rows="3" maxlength="2000" placeholder="Announcement text" required></textarea>
        <div class="row"><span class="tag" id="tzNote"></span><div class="spacer"></div><button class="btn primary" type="submit">Schedule message</button></div>
      </form>
      <div class="list" id="schedList"></div>
    </section>

    <section class="tab" id="tab-voice">
      <div class="card" style="margin-bottom:14px">
        <div class="row"><select id="voiceSel" class="grow" aria-label="Voice channel"></select>
          <button class="btn primary" id="vJoin">Join channel</button><button class="btn danger" id="vLeave">Leave</button></div>
        <div class="row" style="margin-top:10px">
          <button class="btn" id="vMute">Mute bot</button><button class="btn" id="vDeaf">Deafen bot</button>
          <button class="btn" id="vListen">Listen live</button><button class="btn" id="vMic">Talk with mic</button>
          <div class="meter" title="Mic level"><i id="micLvl"></i></div>
        </div>
        <div class="tag" id="vStatus" style="margin-top:8px">Bot is not in a voice channel.</div>
      </div>
      <div class="list" id="vMembers"></div>
    </section>

    <section class="tab" id="tab-admins">
      <form id="adminForm" class="card row" style="margin-bottom:14px">
        <input type="email" id="aEmail" class="grow" placeholder="Sub-admin email" required>
        <input type="password" id="aPass" class="grow" placeholder="Password (6+ characters)" minlength="6" required>
        <button class="btn primary" type="submit">Add sub-admin</button>
      </form>
      <div class="list" id="adminList"></div>
    </section>
  </main>
</div>
<div id="toast" aria-live="polite"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S = { token: sessionStorage.getItem('tk'), me: null, guild: null, chan: null, reply: null, roles: [], member: null, voice: null, socket: null, listen: false, mic: null };

function toast(m, bad) {
  const d = document.createElement('div'); d.className = 't' + (bad ? ' bad' : ''); d.textContent = m;
  $('toast').appendChild(d); setTimeout(() => d.remove(), 3800);
}
async function api(url, opts = {}) {
  const o = { method: opts.method || 'GET', headers: { Authorization: 'Bearer ' + S.token } };
  if (opts.json) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(opts.json); }
  if (opts.form) o.body = opts.form;
  const r = await fetch(url, o);
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && S.token) { logout(true); throw new Error('Session expired. Sign in again.'); }
  if (!r.ok) throw new Error(data.error || 'Request failed');
  return data;
}
const run = (fn) => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, true); } };

/* ---------- auth ---------- */
$('loginForm').onsubmit = async (e) => {
  e.preventDefault(); $('lErr').textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: $('lEmail').value, password: $('lPass').value }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    S.token = d.token; sessionStorage.setItem('tk', d.token); $('lPass').value = '';
    boot();
  } catch (err) { $('lErr').textContent = err.message; }
};
function logout(silent) {
  if (!silent) fetch('/api/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + S.token } }).catch(() => {});
  stopListen(); stopMic();
  S.token = null; sessionStorage.removeItem('tk'); S.socket?.disconnect(); S.socket = null;
  $('login').classList.remove('hidden');
}
$('logout').onclick = () => logout();

async function boot() {
  try { S.me = await api('/api/me'); } catch { return $('login').classList.remove('hidden'); }
  $('login').classList.add('hidden');
  $('who').textContent = `${S.me.email} · ${S.me.role === 'head' ? 'Head admin' : 'Sub-admin'}`;
  $('adminTabBtn').classList.toggle('hidden', S.me.role !== 'head');
  $('tzNote').textContent = 'Time uses your device time zone: ' + Intl.DateTimeFormat().resolvedOptions().timeZone;
  connectSocket(); await loadGuilds();
}

/* ---------- sockets ---------- */
function connectSocket() {
  S.socket = io({ auth: { token: S.token } });
  S.socket.on('connect_error', (e) => { if (e.message === 'unauthorized') logout(true); });
  S.socket.on('message:new', (m) => { if (m.channelId === S.chan) { addMsg(m); scrollMsgs(); } });
  S.socket.on('message:reaction', (m) => { if (m.channelId === S.chan) { const el = $('m-' + m.id); if (el) el.replaceWith(msgEl(m)); } });
  S.socket.on('voice:update', (v) => { S.voice = v; renderVoice(); });
  S.socket.on('voice:speaking', ({ userId, speaking }) => { document.querySelector(`[data-uid="${userId}"]`)?.classList.toggle('speak', speaking); });
  S.socket.on('guilds:update', () => loadGuilds().catch(() => {}));
  S.socket.on('schedules:update', () => loadSchedules().catch(() => {}));
  S.socket.on('audio:chunk', playChunk);
}

/* ---------- servers ---------- */
async function loadGuilds() {
  const list = await api('/api/guilds');
  $('servers').innerHTML = '';
  if (!list.length) { $('servers').innerHTML = '<div class="tag" style="padding:6px;text-align:center">No servers yet</div>'; }
  list.forEach((g) => {
    const b = document.createElement('button');
    b.className = 'srv' + (S.guild?.id === g.id ? ' active' : ''); b.title = g.name; b.setAttribute('aria-label', g.name);
    if (g.icon) b.style.backgroundImage = `url("${g.icon}")`; else b.textContent = g.name.split(/\s+/).map((w) => w[0]).join('').slice(0, 3);
    b.onclick = run(() => selectGuild(g)); $('servers').appendChild(b);
  });
}
$('refreshGuilds').onclick = run(async () => { await loadGuilds(); toast('Servers refreshed'); });

async function selectGuild(g) {
  S.guild = g; S.chan = null; S.member = null;
  $('sname').textContent = g.name;
  document.querySelectorAll('.srv').forEach((b) => b.classList.toggle('active', b.title === g.name));
  S.socket.emit('guild:watch', g.id);
  const ch = await api(`/api/guilds/${g.id}/channels`);
  const opts = (arr) => arr.map((c) => `<option value="${c.id}">#${esc(c.name)}</option>`).join('') || '<option value="">No channels</option>';
  $('chanSel').innerHTML = opts(ch.text); $('schedChan').innerHTML = opts(ch.text);
  $('voiceSel').innerHTML = ch.voice.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('') || '<option value="">No voice channels</option>';
  await Promise.allSettled([loadMsgs(), loadRoles(), loadSchedules(), loadVoice()]);
}

/* ---------- tabs ---------- */
$('tabs').onclick = (e) => {
  const t = e.target.closest('button'); if (!t) return;
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('active', b === t));
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x.id === 'tab-' + t.dataset.t));
  if (t.dataset.t === 'admins') loadAdmins().catch((e) => toast(e.message, true));
};

/* ---------- chat ---------- */
$('chanSel').onchange = run(() => { S.chan = $('chanSel').value; return loadMsgs(); });
$('reloadMsgs').onclick = run(loadMsgs);
function scrollMsgs() { const m = $('msgs'); m.scrollTop = m.scrollHeight; }
async function loadMsgs() {
  if (!S.guild) return;
  S.chan = $('chanSel').value; const box = $('msgs');
  if (!S.chan) { box.innerHTML = '<div class="empty">This server has no text channels the bot can see.</div>'; return; }
  box.innerHTML = '<div class="empty">Loading messages…</div>';
  const list = await api(`/api/guilds/${S.guild.id}/channels/${S.chan}/messages`);
  box.innerHTML = list.length ? '' : '<div class="empty">No messages yet. Send the first one below.</div>';
  list.forEach(addMsg); scrollMsgs();
}
function msgEl(m) {
  const d = document.createElement('div'); d.className = 'msg'; d.id = 'm-' + m.id;
  const atts = m.attachments.map((a) => a.type.startsWith('image/') ? `<a href="${esc(a.url)}" target="_blank" rel="noopener"><img src="${esc(a.url)}" alt="${esc(a.name)}"></a>` : `<div><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name)}</a></div>`).join('');
  d.innerHTML = `<img class="av" src="${esc(m.author.avatar)}" alt="">
  <div style="min-width:0"><div class="head">${esc(m.author.name)}${m.author.bot ? ' <small>bot</small>' : ''}<small>${new Date(m.createdAt).toLocaleString()}</small></div>
  ${m.reply ? `<div class="refl">Replying to a message</div>` : ''}
  <div class="body">${esc(m.content)}</div><div class="atts">${atts}</div>
  <div>${m.reactions.map((r) => `<span class="react">${esc(r.emoji)} ${r.count}</span>`).join('')}</div></div>
  <div class="mact"><button data-a="reply" title="Reply">Reply</button>${['👍','❤️','😂'].map((e) => `<button data-a="react" data-e="${e}">${e}</button>`).join('')}<button data-a="react" data-e="?" title="Other emoji">+</button></div>`;
  d.querySelector('.mact').onclick = run(async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.a === 'reply') { S.reply = m.id; $('replyTxt').textContent = `Replying to ${m.author.name}: ${m.content.slice(0, 60)}`; $('replybar').classList.remove('hidden'); $('msgText').focus(); return; }
    let emoji = b.dataset.e; if (emoji === '?') { emoji = prompt('Emoji to react with'); if (!emoji) return; }
    await api(`/api/guilds/${S.guild.id}/channels/${S.chan}/messages/${m.id}/react`, { method: 'POST', json: { emoji } });
    toast('Reaction added');
  });
  return d;
}
function addMsg(m) { const box = $('msgs'); box.querySelector('.empty')?.remove(); if (!$('m-' + m.id)) box.appendChild(msgEl(m)); }
$('cancelReply').onclick = () => { S.reply = null; $('replybar').classList.add('hidden'); };
$('composer').onsubmit = run(async (e) => {
  e.preventDefault();
  if (!S.guild || !S.chan) throw new Error('Pick a server and channel first');
  const fd = new FormData(); fd.append('content', $('msgText').value);
  if (S.reply) fd.append('replyTo', S.reply);
  [...$('files').files].forEach((f) => fd.append('files', f));
  $('sendBtn').disabled = true;
  try { await api(`/api/guilds/${S.guild.id}/channels/${S.chan}/messages`, { method: 'POST', form: fd }); }
  finally { $('sendBtn').disabled = false; }
  $('msgText').value = ''; $('files').value = ''; $('cancelReply').onclick();
});
$('msgText').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('composer').requestSubmit(); } };

/* ---------- roles ---------- */
async function loadRoles() {
  S.roles = await api(`/api/guilds/${S.guild.id}/roles`);
  S.roles.sort((a, b) => b.pinned - a.pinned);
  $('roleList').innerHTML = S.roles.map((r) => `<div class="item"><span class="dot" style="background:${r.color === '#000000' ? '#99aab5' : r.color}"></span><span style="flex:1">${esc(r.name)}<div class="tag">${r.members} members</div></span><button class="pin ${r.pinned ? 'on' : ''}" data-r="${r.id}" aria-label="${r.pinned ? 'Unpin' : 'Pin'} ${esc(r.name)}">★</button></div>`).join('') || '<div class="tag">No roles found.</div>';
  $('roleList').querySelectorAll('.pin').forEach((b) => b.onclick = run(async () => {
    const r = await api(`/api/guilds/${S.guild.id}/roles/${b.dataset.r}/pin`, { method: 'POST' });
    toast(r.pinned ? 'Role pinned' : 'Role unpinned'); await loadRoles(); renderMemberRoles();
  }));
  await loadMembers();
}
async function loadMembers() {
  const q = $('memberQ').value.trim();
  const list = await api(`/api/guilds/${S.guild.id}/members${q ? '?q=' + encodeURIComponent(q) : ''}`);
  S.members = list;
  $('memberList').innerHTML = list.map((m) => `<button class="item ${S.member?.id === m.id ? 'sel' : ''}" data-u="${m.id}"><img src="${esc(m.avatar)}" alt=""><span>${esc(m.name)}<div class="tag">@${esc(m.username)}</div></span></button>`).join('') || '<div class="tag">No members found.</div>';
  $('memberList').querySelectorAll('.item').forEach((b) => b.onclick = () => { S.member = S.members.find((m) => m.id === b.dataset.u); loadMembers().catch(() => {}); renderMemberRoles(); });
}
$('memberGo').onclick = run(loadMembers);
$('memberQ').onkeydown = (e) => { if (e.key === 'Enter') $('memberGo').click(); };
function renderMemberRoles() {
  const box = $('memberRoles'); if (!S.member) return;
  box.innerHTML = `<h3 style="margin:0 0 8px">${esc(S.member.name)}’s roles</h3><div class="chips">${S.roles.map((r) => `<button class="chip ${S.member.roles.includes(r.id) ? 'has' : ''}" data-r="${r.id}" ${r.assignable ? '' : 'disabled title="Bot cannot manage this role"'}>${r.pinned ? '★ ' : ''}${esc(r.name)}</button>`).join('')}</div>`;
  box.querySelectorAll('.chip').forEach((c) => c.onclick = run(async () => {
    const has = S.member.roles.includes(c.dataset.r);
    const r = await api(`/api/guilds/${S.guild.id}/members/${S.member.id}/roles/${c.dataset.r}`, { method: has ? 'DELETE' : 'POST' });
    S.member.roles = has ? S.member.roles.filter((x) => x !== c.dataset.r) : [...S.member.roles, c.dataset.r];
    toast((has ? '− ' : '+ ') + r.message); renderMemberRoles();
  }));
}

/* ---------- schedule ---------- */
async function loadSchedules() {
  if (!S.guild) return;
  const list = await api(`/api/schedules?guildId=${S.guild.id}`);
  $('schedList').innerHTML = list.map((s) => `<div class="item"><div style="flex:1;min-width:0"><div>${esc(s.content.slice(0, 140))}</div><div class="tag">${new Date(s.at).toLocaleString()} · ${esc(s.status)}${s.error ? ' · ' + esc(s.error) : ''} · by ${esc(s.by)}</div></div><button class="btn danger" data-id="${s.id}">${s.status === 'pending' ? 'Cancel' : 'Remove'}</button></div>`).join('') || '<div class="empty">No scheduled messages. Create one above.</div>';
  $('schedList').querySelectorAll('button').forEach((b) => b.onclick = run(async () => { await api('/api/schedules/' + b.dataset.id, { method: 'DELETE' }); toast('Schedule removed'); loadSchedules(); }));
}
$('schedForm').onsubmit = run(async (e) => {
  e.preventDefault();
  if (!S.guild) throw new Error('Pick a server first');
  await api('/api/schedules', { method: 'POST', json: { guildId: S.guild.id, channelId: $('schedChan').value, content: $('schedText').value, at: new Date($('schedAt').value).toISOString() } });
  $('schedText').value = ''; toast('Message scheduled'); loadSchedules();
});

/* ---------- voice ---------- */
async function loadVoice() { S.voice = await api(`/api/guilds/${S.guild.id}/voice`); renderVoice(); }
function renderVoice() {
  const v = S.voice; if (!v) return;
  $('vStatus').textContent = v.connected ? `Connected to ${v.channelName}` : 'Bot is not in a voice channel.';
  $('vMute').classList.toggle('on', v.selfMute); $('vDeaf').classList.toggle('on', v.selfDeaf);
  $('vMute').textContent = v.selfMute ? 'Unmute bot' : 'Mute bot'; $('vDeaf').textContent = v.selfDeaf ? 'Undeafen bot' : 'Deafen bot';
  $('vMembers').innerHTML = v.members.map((m) => `<div class="vm" data-uid="${m.id}"><img src="${esc(m.avatar)}" alt=""><span style="flex:1">${esc(m.name)}${m.bot ? ' <span class="tag">bot</span>' : ''}</span><span class="tag">${m.muted ? 'muted ' : ''}${m.deafened ? 'deafened' : ''}</span></div>`).join('') || '<div class="empty">No one is in the channel the bot joined.</div>';
}
$('vJoin').onclick = run(async () => {
  if (!$('voiceSel').value) throw new Error('Choose a voice channel');
  $('vJoin').disabled = true;
  try { S.voice = await api(`/api/guilds/${S.guild.id}/voice/join`, { method: 'POST', json: { channelId: $('voiceSel').value } }); }
  finally { $('vJoin').disabled = false; }
  renderVoice(); toast('Joined voice channel');
});
$('vLeave').onclick = run(async () => { stopListen(); stopMic(); S.voice = await api(`/api/guilds/${S.guild.id}/voice/leave`, { method: 'POST' }); renderVoice(); toast('Left voice channel'); });
const setState = (k) => run(async () => { S.voice = await api(`/api/guilds/${S.guild.id}/voice/state`, { method: 'POST', json: { [k]: !S.voice[k] } }); renderVoice(); });
$('vMute').onclick = setState('selfMute'); $('vDeaf').onclick = setState('selfDeaf');

/* live audio: Discord -> browser */
let actx = null; const nextAt = {};
function ctx() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 }); if (actx.state === 'suspended') actx.resume(); return actx; }
function playChunk({ userId, pcm }) {
  if (!S.listen) return;
  const c = ctx(), i16 = new Int16Array(pcm.buffer ? pcm.buffer.slice(pcm.byteOffset, pcm.byteOffset + pcm.byteLength) : pcm);
  const n = i16.length / 2, buf = c.createBuffer(2, n, 48000), L = buf.getChannelData(0), R = buf.getChannelData(1);
  for (let i = 0; i < n; i++) { L[i] = i16[i * 2] / 32768; R[i] = i16[i * 2 + 1] / 32768; }
  const src = c.createBufferSource(); src.buffer = buf; src.connect(c.destination);
  const t = Math.max(c.currentTime + 0.05, nextAt[userId] || 0); src.start(t); nextAt[userId] = t + buf.duration;
}
function stopListen() { if (S.listen && S.guild) S.socket?.emit('audio:listen', S.guild.id, false); S.listen = false; $('vListen').classList.remove('on'); $('vListen').textContent = 'Listen live'; }
$('vListen').onclick = () => {
  if (!S.guild) return toast('Pick a server first', true);
  if (S.listen) return stopListen();
  ctx(); S.listen = true; S.socket.emit('audio:listen', S.guild.id, true);
  $('vListen').classList.add('on'); $('vListen').textContent = 'Stop listening';
};
/* live audio: browser mic -> Discord */
function stopMic() {
  if (!S.mic) return;
  S.mic.node.disconnect(); S.mic.src.disconnect(); S.mic.stream.getTracks().forEach((t) => t.stop()); S.mic = null;
  $('micLvl').style.width = '0'; $('vMic').classList.remove('on'); $('vMic').textContent = 'Talk with mic';
}
$('vMic').onclick = run(async () => {
  if (S.mic) return stopMic();
  if (!S.voice?.connected) throw new Error('Join a voice channel first');
  if (!navigator.mediaDevices?.getUserMedia) throw new Error('Microphone needs HTTPS or localhost');
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
  const c = ctx(), src = c.createMediaStreamSource(stream), node = c.createScriptProcessor(2048, 1, 1);
  const gid = S.guild.id, ratio = c.sampleRate / 48000;
  node.onaudioprocess = (e) => {
    const f = e.inputBuffer.getChannelData(0), n = Math.floor(f.length / ratio), out = new Int16Array(n); let peak = 0;
    for (let i = 0; i < n; i++) { const v = Math.max(-1, Math.min(1, f[Math.floor(i * ratio)])); peak = Math.max(peak, Math.abs(v)); out[i] = v * 32767; }
    $('micLvl').style.width = Math.min(100, peak * 140) + '%';
    S.socket.volatile.emit('audio:mic', gid, out.buffer);
  };
  const mute = c.createGain(); mute.gain.value = 0; src.connect(node); node.connect(mute); mute.connect(c.destination);
  S.mic = { stream, src, node }; $('vMic').classList.add('on'); $('vMic').textContent = 'Stop mic';
});

/* ---------- admins ---------- */
async function loadAdmins() {
  const list = await api('/api/admins');
  $('adminList').innerHTML = list.map((a) => `<div class="item"><span style="flex:1">${esc(a.email)}<div class="tag">Added ${new Date(a.createdAt).toLocaleDateString()}</div></span><button class="btn danger" data-e="${esc(a.email)}">Remove</button></div>`).join('') || '<div class="empty">No sub-admins yet. Add one above.</div>';
  $('adminList').querySelectorAll('button').forEach((b) => b.onclick = run(async () => { await api('/api/admins/' + encodeURIComponent(b.dataset.e), { method: 'DELETE' }); toast('Sub-admin removed'); loadAdmins(); }));
}
$('adminForm').onsubmit = run(async (e) => {
  e.preventDefault();
  await api('/api/admins', { method: 'POST', json: { email: $('aEmail').value, password: $('aPass').value } });
  $('aEmail').value = ''; $('aPass').value = ''; toast('Sub-admin added'); loadAdmins();
});

if (S.token) boot();
</script>
